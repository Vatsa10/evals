<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<title>Evals · Run report</title>
<style>
:root{color-scheme:dark;--bg:oklch(.145 .005 260);--panel:oklch(.19 .005 260);--text:oklch(.94 .005 260);--muted:oklch(.73 .005 260);--line:oklch(.32 .005 260);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-underline-offset:4px}a:hover{color:oklch(.99 .005 260)}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:42px;padding:8px 12px}button{cursor:pointer}button:hover{background:oklch(.27 .005 260)}:focus-visible{outline:2px solid var(--text);outline-offset:4px}.skip{position:absolute;top:-90px;left:20px;z-index:4}.skip:focus{top:12px;background:var(--panel);padding:10px}header,main,footer{max-width:1220px;margin:auto;padding:0 36px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:26px;padding-bottom:26px;border-bottom:1px solid var(--line)}.wordmark{font-size:20px;font-weight:650;letter-spacing:-1px}.wordmark span{color:var(--muted);font-weight:400;font-size:13px;letter-spacing:0;margin-left:20px}.mono{font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.muted{color:var(--muted)}main{padding-top:44px;padding-bottom:44px}h1{font-size:30px;font-weight:550;letter-spacing:-.8px;line-height:1.25;margin:12px 0;overflow-wrap:anywhere}h2{font-size:19px;font-weight:550;margin:0}p{max-width:75ch}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.title-line{display:flex;justify-content:space-between;gap:24px;align-items:start}.title-line label{min-width:165px}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.title-line select{width:100%}.facts{display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0 24px;border-bottom:1px solid var(--line)}.facts span{font-size:14px}.provenance{margin-top:20px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}.provenance strong{color:var(--text);font-weight:500}.comparison{padding:20px 0;margin-top:16px;border-bottom:1px solid var(--line)}.comparison p{margin:6px 0}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);padding:3px 8px;border-radius:5px;font-size:12px;white-space:nowrap}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:36px 0 14px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums}th{font-weight:450;color:var(--muted);font-size:12px;background:var(--panel);white-space:nowrap}th,td{padding:13px 16px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td{font-size:14px}.num{text-align:right;white-space:nowrap}.category-button{border:0;background:none;padding:0;min-height:32px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}.category-button:hover{background:none;text-decoration-color:var(--text)}.toolbar{display:grid;grid-template-columns:minmax(160px,1fr) 180px 180px 170px;gap:14px;margin-bottom:16px}.toolbar input,.toolbar select{width:100%;min-width:0}.rate{display:flex;gap:12px;align-items:center;justify-content:flex-end}.track{height:5px;width:76px;background:oklch(.3 .005 260);border-radius:4px;overflow:hidden}.fill{height:100%;background:oklch(.84 .005 260);width:var(--rate)}.case-name{overflow-wrap:anywhere;max-width:400px}.case-name summary{cursor:pointer;min-height:32px;align-content:center}.case-detail{font-size:12px;color:var(--muted);max-width:400px;margin:8px 0 0 16px}.empty{padding:32px;text-align:center;color:var(--muted)}.scope{font-size:12px;color:var(--muted);margin:18px 0 0}.excluded{font-size:13px;color:var(--muted);margin-top:12px}.excluded summary{cursor:pointer}.excluded p{overflow-wrap:anywhere}footer{border-top:1px solid var(--line);padding-top:20px;padding-bottom:32px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.hidden{display:none!important}@media(max-width:800px){header,main,footer{padding-left:20px;padding-right:20px}.toolbar{grid-template-columns:1fr 1fr}.title-line{display:block}.title-line label{display:block;margin-top:20px;max-width:240px}h1{font-size:26px}.wordmark span{margin-left:12px}.rate .track{display:none}}@media(max-width:440px){.toolbar{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:4px}header{align-items:start}.version-label{display:none}th,td{padding:12px}.facts{gap:8px 18px}}@media(prefers-reduced-motion:no-preference){button,a{transition:color .15s ease-out,background-color .15s ease-out}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to report</a>
<header><div class="wordmark">evals.<span>Run report</span></div><a class="mono" id="snapshot-link" href="__EVALS_SNAPSHOT_FILE__" download>Download snapshot ↗</a></header>
<main id="main">
<div class="eyebrow">Evaluation evidence <span class="version-label">/ <span id="version" class="mono"></span></span></div>
<div class="title-line"><div><h1 id="suite"></h1><div id="started" class="mono muted"></div></div><label id="run-control"><span class="label">Viewing run</span><select id="run"><option value="candidate">Candidate</option><option value="baseline">Baseline</option></select></label></div>
<div class="facts" id="facts"></div>
<div class="provenance" id="provenance"></div>
<section id="comparison" class="comparison hidden" aria-label="Comparison scope"></section>
<section aria-labelledby="coverage-title"><div class="section-head"><h2 id="coverage-title">Category coverage</h2><span id="coverage-count" class="muted mono"></span></div><div class="table-wrap"><table><thead><tr><th scope="col">Category</th><th scope="col" class="num">Cases</th><th scope="col" class="num">Trials</th><th scope="col" class="num">Passed / failed / errors</th><th scope="col" class="num">Pass rate</th></tr></thead><tbody id="coverage"></tbody></table></div></section>
<section aria-labelledby="cases-title"><div class="section-head"><h2 id="cases-title">Cases</h2><span id="case-count" class="muted mono" aria-live="polite"></span></div>
<div class="toolbar"><label><span class="label">Find a case</span><input id="query" type="search" placeholder="Search case ID" autocomplete="off"></label><label><span class="label">Category</span><select id="category"><option value="all">All categories</option></select></label><label><span class="label">Result</span><select id="status"><option value="all">All results</option><option value="failed">Failed</option><option value="error">Error</option><option value="passed">Passed</option></select></label><label id="view-control"><span class="label">Coverage</span><select id="view"><option value="all">All cases</option><option value="shared">Compatible shared cases</option><option value="one-sided">One-sided cases</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Case / checks</th><th scope="col">Category</th><th scope="col">Result</th><th scope="col" class="num">Trials</th><th scope="col" class="num">Pass rate</th></tr></thead><tbody id="cases"></tbody></table><div id="empty" class="empty hidden">No cases match these filters. Choose all results or clear the search.</div></div>
<p class="scope" id="scope"></p></section>
</main><footer id="privacy"></footer>
<script id="snapshot" type="application/json">__EVALS_SNAPSHOT__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("snapshot").textContent);
const $=id=>document.getElementById(id), controls=["run","category","status","view","query"];
const text=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node};
const percent=value=>value===null?"Untested":`${Math.round(value*1000)/10}%`;
const state={run:"candidate",category:"all",status:"all",view:"all",query:""};
function fromURL(){const p=new URLSearchParams(location.search);for(const key of controls)state[key]=p.get(key==="query"?"q":key)||({run:"candidate",query:""}[key]??"all");if(!data.runs[state.run])state.run="candidate";if(!["all","passed","failed","error"].includes(state.status))state.status="all";if(!["all","shared","one-sided"].includes(state.view))state.view="all";if(!data.comparison)state.view="all"}
function syncURL(push=false){const url=new URL(location.href);for(const key of controls){const param=key==="query"?"q":key;const value=state[key],def=({run:"candidate",query:""}[key]??"all");if(value===def)url.searchParams.delete(param);else url.searchParams.set(param,value)}try{if(url.href!==location.href)history[push?"pushState":"replaceState"](null,"",url)}catch(_){/* file URLs can restrict history; controls still work */}}
function rateCell(value){const cell=text("td","","num");const wrap=text("div","","rate");if(value!==null){const track=text("div","","track"),fill=text("div","","fill");fill.style.setProperty("--rate",`${Math.max(0,Math.min(100,value*100))}%`);track.append(fill);wrap.append(track)}wrap.append(text("span",percent(value)));cell.append(wrap);return cell}
function render(){const run=data.runs[state.run];$("suite").textContent=run.suite;document.title=`${run.suite} · Evals`;$("started").textContent=`${run.started_at||"Time not recorded"} · ${run.mode==="live"?"Adapter executed":"Recorded replay"}`;$("version").textContent=data.version.slice(0,12);$("run-control").classList.toggle("hidden",!data.runs.baseline);$("view-control").classList.toggle("hidden",!data.comparison);
const categories=[...new Set(Object.values(data.runs).flatMap(r=>r.coverage.map(c=>c.category)))].sort();$("category").replaceChildren(new Option("All categories","all"),...categories.map(c=>new Option(c,c)));if(!categories.includes(state.category))state.category="all";for(const key of controls)$(key).value=state[key];
$("facts").replaceChildren(...[`${run.cases.length} ${run.cases.length===1?"case":"cases"}`,`${run.summary.total} ${run.summary.total===1?"trial":"trials"}`,`${run.summary.passed} passed`,`${run.summary.failed} failed`,`${run.summary.error} ${run.summary.error===1?"error":"errors"}`].map(v=>text("span",v)));
const p=run.provenance,e=p.declared_environment||{},a=p.adapter_reported||{},declared=[e.provider,e.model].filter(Boolean),observed=[...(a.providers||[]),...(a.model_ids||[])];$("provenance").replaceChildren(text("strong",`Provenance: ${(p.kind||"unknown").replaceAll("_"," ")}`),text("span",` · ${p.source?.label||"No source label"}${declared.length?" · Declared: "+declared.join(" / "):""}${observed.length?" · Adapter-reported: "+[...new Set(observed)].join(" / "):" · Observed model not recorded"}${a.model_modes?.length?" · Model mode: "+a.model_modes.join(", "):""}`));if(p.source?.source_url){try{const url=new URL(p.source.source_url);if(["https:","http:"].includes(url.protocol)){const link=text("a","Source");link.href=url.href;link.rel="noreferrer";$("provenance").append(text("span"," · "),link)}}catch(_){}}if(p.source?.evaluated_at)$("provenance").append(text("span",` · Source evaluated: ${p.source.evaluated_at}`));if(p.configuration_sha256){const fingerprint=text("span",` · Configuration: ${p.configuration_sha256.slice(0,12)}`);fingerprint.title=p.configuration_sha256;$("provenance").append(fingerprint)}
$("coverage").replaceChildren(...run.coverage.map(c=>{const row=document.createElement("tr"),name=document.createElement("td"),button=text("button",c.category,"category-button");button.type="button";button.addEventListener("click",()=>{state.category=c.category;syncURL(true);render()});name.append(button);row.append(name,text("td",String(c.cases),"num"),text("td",String(c.trials),"num"),text("td",`${c.passed} / ${c.failed} / ${c.error}`,"num"),rateCell(c.success_rate));return row}));$("coverage-count").textContent=`${run.coverage.filter(c=>c.status==="tested").length}/${run.coverage.length} declared or observed categories tested`;
const comparison=data.comparison;$("comparison").classList.toggle("hidden",!comparison);if(comparison){const region=$("comparison");region.replaceChildren(text("span",comparison.scope==="shared_cases"?"Exploratory overlap only":"Full dataset comparison","tag"));const sharedIds=new Set(comparison.shared_cases),totals=role=>data.runs[role].cases.filter(c=>sharedIds.has(c.id)).reduce((a,c)=>({passed:a.passed+c.passed,total:a.total+c.trials}),{passed:0,total:0}),b=totals("baseline"),c=totals("candidate");region.append(text("p",sharedIds.size?`Baseline ${b.passed}/${b.total} → candidate ${c.passed}/${c.total} passing comparable trials.`:"No compatible shared cases to compare."));region.append(text("p",comparison.warning||"Same dataset and grading contract. Improvement verification also requires the session's source, error, regression and attempt gates.","muted"));const details=document.createElement("details");details.className="excluded";details.append(text("summary",`${comparison.shared_cases.length} compatible shared · ${comparison.baseline_only.length} baseline-only · ${comparison.candidate_only.length} candidate-only · ${comparison.incompatible_cases.length} incompatible`));for(const [label,values]of[["Baseline only",comparison.baseline_only],["Candidate only",comparison.candidate_only],["Incompatible",comparison.incompatible_cases.map(c=>c.id)]])if(values.length)details.append(text("p",`${label}: ${values.join(", ")}`));region.append(details)}
const shared=new Set(comparison?.shared_cases||[]),oneSided=new Set([...(comparison?.baseline_only||[]),...(comparison?.candidate_only||[])]);const rows=run.cases.filter(c=>(state.category==="all"||c.category===state.category)&&(state.status==="all"||c.status===state.status)&&c.id.toLowerCase().includes(state.query.toLowerCase())&&(state.view==="all"||(state.view==="shared"?shared.has(c.id):oneSided.has(c.id))));$("cases").replaceChildren(...rows.map(c=>{const row=document.createElement("tr"),name=text("td","","case-name"),detail=document.createElement("details");detail.append(text("summary",c.id));detail.append(text("p",`${c.passed} passed, ${c.failed} failed, ${c.error} errors. ${c.failed_graders.length?"Unsuccessful checks: "+c.failed_graders.join(", "):"All observed checks passed."}`,"case-detail"));name.append(detail);row.append(name,text("td",c.category),text("td",c.status),text("td",String(c.trials),"num"),rateCell(c.success_rate));return row}));$("case-count").textContent=`Showing ${rows.length} of ${run.cases.length}`;$("empty").classList.toggle("hidden",rows.length>0);$("scope").textContent=run.scope;$("privacy").textContent=`${data.privacy} Snapshot ${data.version}. Hashes identify content; they are not signatures.`}
for(const key of controls)$(key).addEventListener(key==="query"?"input":"change",event=>{state[key]=event.target.value;syncURL(key!=="query");render()});window.addEventListener("popstate",()=>{fromURL();render()});fromURL();render();
</script>
</body>
</html>
