[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evals-framework"
version = "0.5.1"
description = "Independent evaluation engine and workflows for Claude Code and Codex"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
readme = "README.md"

[project.optional-dependencies]
verifier = ["cryptography>=44,<47"]

[project.scripts]
evals = "evals.cli:main"

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.setuptools.package-data]
evals = ["assets/*.html"]
