[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evals-framework"
version = "0.2.0"
description = "Independent evaluation engine and workflows for Claude Code and Codex"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
readme = "README.md"

[project.scripts]
evals = "evals.cli:main"

[tool.setuptools.packages.find]
include = ["evals*"]
