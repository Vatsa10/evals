name: Framework checks

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r verifier-requirements.lock
      - run: python scripts/check_framework.py
      - run: python scripts/build_plugin.py dist/evals-marketplace
      - run: python -m evals init .evals/smoke
      - run: python -m evals run .evals/smoke/suite.json --output .evals/smoke-report.json
      - run: python -m evals summarize .evals/smoke-report.json --output .evals/smoke-summary.json
      - run: python dist/evals-marketplace/plugins/evals/scripts/evals.py brief init .evals/smoke-brief.json --project-root .
      - run: python dist/evals-marketplace/plugins/evals/scripts/evals.py report-site .evals/smoke-report.json --output .evals/smoke-site
  isolated-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r verifier-requirements.lock
      - run: python scripts/check_verifier_docker.py --pull
      - run: python scripts/check_gateway_docker.py
      - run: python scripts/live_isolated_test.py --workspace .evals/live-fixture --model fixture
      - run: python scripts/prepare_remote_test.py --workspace .evals/live-fixture --output .evals/remote-kit
      - run: python -m evals verifier run-kit --kit .evals/remote-kit --private-key .evals/live-fixture/development-signing.pem --public-key .evals/live-fixture/development-public.pem --review .evals/live-fixture/review.json --request-id portable-local-fixture --output .evals/portable-result
