name: Website readability checks

on:
  push:
    paths:
      - 'website/**'
      - 'scripts/check_website.py'
      - '.github/workflows/website-checks.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/check_website.py'
      - '.github/workflows/website-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_website.py --serve --output .evals/website-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-review
          path: .evals/website-checks
          if-no-files-found: warn
